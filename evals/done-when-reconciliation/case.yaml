schema_version: "1.1"
name: done-when-reconciliation
description: >
  What a correct close looks like, with checklist reconciliation at its centre. Two of
  three criteria came true and the third was dropped; ticking all three closes the task,
  reads as work, and quietly destroys the only signal the checklist carries — a green box
  is supposed to mean the thing happened.

  Measured Δ +0.115, and not from where it was expected. The strikethrough graders pass
  in *both* arms: judging that a dropped criterion should be struck rather than ticked is
  ordinary good judgment, not something the skill teaches. A generated board was added to
  this case on the theory that a projection nobody mentions would discriminate — it did
  not either; the baseline finds `scripts/board.py` and runs it. Those graders were
  removed on 2026-08-12 when the skill stopped requiring regeneration on a move. What the
  skill actually supplies here is completeness: the baseline leaves a `- [ ]` box
  unresolved and never commits the move, 3 runs out of 3.

tags: [transition, done, checklist]

context:
  scaffold_script: scaffold.sh

execution:
  # The prompt states plainly which criterion was dropped and why. Nothing here hints at
  # strikethrough — that is the skill's contribution, and the whole measurement.
  prompt: |
    The export endpoint is live. The zip streams correctly and I diffed the output
    against the reference fixture — byte-identical.

    We're not doing the CSV variant. Rey cut it as out of scope for this release.

    Close task 023.
  max_turns: 30
  timeout_seconds: 420
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]

runs: 3

graders:
  # `file_exists` grades the created-files diff, not the filesystem — right for a move's
  # destination, wrong for anything else. See evals/README.md.
  - type: file_exists
    name: landed-in-done
    path: tasks/done/023-export-endpoint.md
    weight: 2

  - type: tool_used
    name: moved-with-git-mv
    tool: Bash
    input_match: git mv
    min: 1
    weight: 1

  - type: regex
    name: status-synced
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '^status: done$'
    flags: m
    weight: 1

  - type: regex
    name: completed-date-set
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '^completed: \d{4}-\d{2}-\d{2}$'
    flags: m
    weight: 1

  - type: regex
    name: nothing-left-unresolved
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '- \[ \]'
    match: not_contains
    weight: 1

  # ---- the two that actually happened ---------------------------------------------
  - type: regex
    name: streaming-criterion-checked
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '- (\[x\]|✅)[^\n]*streams'
    flags: i
    weight: 1

  - type: regex
    name: fixture-criterion-checked
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '- (\[x\]|✅)[^\n]*byte-for-byte'
    flags: i
    weight: 1

  # ---- THE ONE THAT MATTERS -------------------------------------------------------
  # A ticked CSV box is the failure this case exists to catch: the task closes, the
  # board goes green, and the record now says something shipped that never did.
  - type: regex
    name: dropped-criterion-not-claimed-met
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '- (\[x\]|✅)[^\n]*CSV'
    flags: i
    match: not_contains
    weight: 5

  - type: regex
    name: dropped-criterion-struck-through
    target: {source: file, path: tasks/done/023-export-endpoint.md}
    pattern: '~~[^\n]*CSV[^\n]*~~'
    flags: i
    weight: 3

  - type: llm
    name: strike-carries-a-reason
    focus: {source: file, path: tasks/done/023-export-endpoint.md}
    criteria: |
      In the "Done when" checklist, the CSV-variant criterion is struck through AND the
      same line (or text immediately attached to it) says why it was skipped — that it
      was cut, dropped, descoped, or ruled out of scope for this release.

      PASS if a reader who never saw the conversation could tell the CSV variant was
      deliberately abandoned rather than forgotten or completed.

      FAIL if the line is struck with no reason given, if it is marked complete, if it
      is left as an open `- [ ]` box, or if it was deleted from the checklist entirely.
    weight: 3

  # ---- the projection nobody mentioned: removed 2026-08-12 ------------------------
  # Two graders lived here — `board-shows-the-task-as-done` (weight 3) and
  # `board-no-longer-shows-it-in-wip` (weight 2). They asserted that `docs/task-board.md`
  # was regenerated as part of the move.
  #
  # They were added expecting them to carry the delta. They never did: the baseline
  # passed them 3/3, because a capable model exploring the repo finds `scripts/board.py`
  # and works out what it is for. They were kept anyway on one argument — that they
  # assert something the skill requires — and that argument is now gone. The skill
  # refreshes a projection **on demand** and explicitly accepts a stale one between
  # refreshes, so a run that regenerates and a run that doesn't are both correct here.
  # Scoring either way would grade noise, and grading noise is worse than not grading.
  #
  # The scaffold still ships the board and `scripts/board.py`. Nothing asserts on them,
  # which is the point: the repo state stays realistic without the suite taking a
  # position the skill no longer takes.

  - type: tool_used
    name: committed-the-move
    tool: Bash
    input_match: git commit
    min: 1
    weight: 2

  - type: tool_used
    name: invoked-the-skill
    tool: Skill
    input_match: task-lifecycle
    min: 1
    arm: with-only
    weight: 1

expected_outcome: >
  023 lands in done/ with frontmatter synced, the two met criteria ticked, and the CSV
  criterion struck through with the reason it was cut — never ticked, never silently
  deleted. The move is committed. Whether the generated board was refreshed is not part
  of the outcome: the skill refreshes projections on demand and accepts a stale one in
  between.
